name: Product Owner
version: 0.1.0
description: >
  Gera User Stories, Épicos e Critérios de Aceitação a partir de PRDs (gerados
  pelo agente irmão AQuA-QE Product Manager), documentos de requisitos e
  tickets Jira, com rastreabilidade à fonte e validação automática
  (INVEST/DoR) antes da revisão humana obrigatória.

inputs:
  - txt
  - markdown
  - chat
  - jira
  - confluence

outputs:
  - user_story
  - acceptance
  - markdown

skills:
  - read_text_file
  - parse_chat_transcript
  - format_chat_transcript
  - read_jira_issue
  - read_confluence_page
  - retrieve_chunks
  - record_refinement_answer
  - suggest_refinement_answer
  - extract_requirements
  - extract_prd_context
  - identify_epic_groups
  - identify_actor
  - identify_goal
  - identify_business_rules
  - identify_dependencies
  - generate_story
  - validate_story
  - review_story
  - generate_clarifying_questions
  - refine_story
  - diff_story_versions
  - generate_epic_metadata
  - validate_epic
  - review_epic
  - generate_epic_clarifying_questions
  - refine_epic_metadata
  - diff_epic_versions
  - validate_traceability
  - generate_traceability_matrix
  - format_epic_markdown
  - parse_epic_markdown
  - parse_story_markdown
  - export_markdown
  - update_jira_issue
  - create_jira_epic
  - update_jira_epic
  - create_jira_story

memory:
  vector: true
  rag: true
  knowledge_graph: false

rules: rules.md
spec: ai_spec.md
